<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Arena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #171a2b; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 20px)); pointer-events: none; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-radius: 999px; background: #0b0d18d0; font-weight: 800; white-space: nowrap; }
  #phase { flex: 1; overflow: hidden; text-overflow: ellipsis; } #clock { font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe89a, #f0b429 60%, #b07a10); vertical-align: -2px; margin-right: 4px; }
  .heart { color: #ff5d73; margin-right: 3px; }
  #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 6px; font-size: 12px; font-weight: 700; }
  #chips span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 999px; background: #0b0d18b0; border-left: 4px solid var(--c); white-space: nowrap; }
  #chips span.me { color: #ffe08a; } #chips span.out { opacity: .4; text-decoration: line-through; }
  #chips i { display: inline-block; width: 32px; height: 5px; border-radius: 3px; background: #ffffff22; overflow: hidden; } #chips i b { display: block; height: 100%; background: var(--c); }
  #msg { position: fixed; left: 0; width: 100vw; top: 38%; box-sizing: border-box; padding: 0 12px; text-align: center; font: 900 44px/1.1 system-ui, sans-serif; text-shadow: 0 4px 0 #0008; pointer-events: none; transition: opacity .3s; }
  #msg small { display: block; font-size: 17px; font-weight: 800; margin-top: 6px; }
  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 8px; font-size: 11px; opacity: .7; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0009; }
  #over[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #20243a; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 12px; opacity: .85; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1d00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  .box small { display: block; margin-top: 8px; opacity: .6; font-size: 12px; }
  #safe { position: fixed; bottom: 0; height: 0; padding-bottom: env(safe-area-inset-bottom); visibility: hidden; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="top"><div id="bar"><span id="phase">Round 1</span><span id="clock"></span><span><span class="coin"></span><span id="gold">0</span></span><span><span class="heart">♥</span><span id="hp">20</span></span></div><div id="chips"></div></div>
<div id="msg"></div>

<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>This game</h3><ol id="places"></ol>

  <button id="again">Play again</button><small id="next"></small>
</div></div>
<div id="safe"></div>
<script>
/* ═══ AUTO ARENA · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Buy units, place them, watch them fight. Last one standing wins. Versus, 2–8 players; bots take the empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ health, timers, gold, the shop, and the eight units
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ARMIES ........ a board of 8 cells + a bench of 4; buying, selling, three-of-a-kind merges
 *   BATTLE ........ the fight simulation: same boards + same seed = the same fight on every screen
 *   GAME (HOST) ... rounds, pairings, damage, the bots' shopping, seats. Only the host writes shared fields.
 *   MY ARMY ....... my gold, shop and units (they live in my own entity)
 *   DRAW .......... the arena, units, effects, my bench and the shop
 *   HUD & RESULTS . round, clock, gold, health, standings, results card, leaderboard
 *   INPUT ......... tap a card to buy, drag units to place, drag onto the shop to sell
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - `game` (one JSON field: id, v, phase shop/fight/over, round, endsAt, startAt, seed, pairs,
 *     seats with health, last round's results, winner) is written only by the HOST.
 *   - Each player writes its OWN entity: `n`, `c`, `hb`, and `army` (gold, board, bench). Your shop
 *     and your money are yours; the host only reads your board when the fight starts.
 *   - When the shop timer ends (or everyone pressed Fight), the HOST copies every board into
 *     `boards`, pairs everyone up, picks a seed and writes it all. Every client then replays its
 *     own fight from the boards and the seed: the fight is computed, not streamed, so every
 *     screen shows the same battle. The host works out the results the same way and writes them.
 *   - Bots shop in the host's memory; their armies sit in `bots` so a new host (or a friend who
 *     takes a bot's seat) carries them on. A player who leaves hands their army to a bot.
 *   - Intents to the host: "ready" {g, r} (Fight now) and "again" {g} (Play again).
 *   - ?attract plays offline, bots only, big armies (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each game a player wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,            // fighters in a game; bots take the empty seats (2 to 8)
  hp: 20,              // everyone's health at the start
  shopMs: 25000,       // time to shop and place units between fights
  fightDelayMs: 1500,  // "Fight!" shows this long before the units move
  fightCapMs: 30000,   // a fight still going after this is a draw
  afterFightMs: 2500,  // the result stays up this long, then the next shop opens
  resultsMs: 15000,    // the final results card shows this long, then a new game starts
  startGold: 6,        // gold for the first shop
  income: 5,           // gold at every shop after that
  winBonus: 1,         // extra gold after a won fight
  rerollCost: 1,       // gold for a fresh shop
  shopSize: 5,         // cards in the shop
  boardBase: 2,        // units you may field = this + the round number (8 at most)
  seatGraceMs: 8000,   // a player silent this long hands their army to a bot
  board: "wins",       // leaderboard name
  // The units. cost in gold; hp; atk = damage per hit; rate = hits per second; range and speed in
  // cells; armor = share of damage ignored; splash = radius that also takes half damage; heal per cast.
  units: {
    brute:  { name: "Brute",  cost: 1, hp: 440,  atk: 42, rate: 0.85, range: 1.0, speed: 1.0, look: "#d98c5f", what: "Tough and cheap" },
    archer: { name: "Archer", cost: 1, hp: 220,  atk: 36, rate: 0.95, range: 3.2, speed: 0.9, look: "#9fd36b", what: "Shoots from the back" },
    imp:    { name: "Imp",    cost: 1, hp: 190,  atk: 22, rate: 2.2,  range: 1.0, speed: 1.7, look: "#ef6fae", what: "Fast, lots of small hits" },
    knight: { name: "Knight", cost: 2, hp: 580,  atk: 52, rate: 0.8,  range: 1.0, speed: 1.0, armor: 0.3, look: "#c9d3e3", what: "Takes 30% less damage" },
    mage:   { name: "Mage",   cost: 2, hp: 260,  atk: 52, rate: 0.6,  range: 3.0, speed: 0.9, splash: 1.1, look: "#8c7cf0", what: "Blasts a small area" },
    healer: { name: "Healer", cost: 2, hp: 290,  atk: 18, rate: 0.8,  range: 3.0, speed: 0.9, heal: 50, look: "#f4e9c8", what: "Heals the most hurt friend" },
    golem:  { name: "Golem",  cost: 3, hp: 1050, atk: 66, rate: 0.55, range: 1.1, speed: 0.7, splash: 0.9, look: "#8a8f9c", what: "Huge, smashes an area" },
    dragon: { name: "Dragon", cost: 3, hp: 620,  atk: 70, rate: 0.7,  range: 2.8, speed: 1.1, splash: 0.9, look: "#ff7a45", what: "Breathes fire on a group" },
  },
};
const KEYS = Object.keys(CONFIG.units);
const STARS = [0, 1, 1.8, 3.2]; // stat multiplier at 1, 2 and 3 stars (three of a kind merge one star up)
const TEAM = ["#4f8cff", "#ff5a5f"]; // in a fight: your side (bottom) and theirs (top)
const COLORS = ["#4f8cff", "#ff5a5f", "#3ecf7a", "#ffc23d", "#b77bff", "#ff8a3d", "#2fd4d4", "#ff6fb5"];
const BOT_NAMES = ["Rook", "Mira", "Tank", "Juno", "Pip", "Vex", "Ozzy", "Lark"];
const NAME_A = ["Brave", "Clever", "Lucky", "Grand", "Sly", "Steady"], NAME_B = ["Tactician", "Captain", "Chief", "Warden", "Coach", "Boss"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'auto-arena',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── ARMIES ──────────────────────────────────────────────────────────────────────────
// An army is { g: gold, bd: 8 board cells, bn: 4 bench slots }; a unit is [key, stars].
// Board cells 0–3 are the front row, 4–7 the back row.
const emptyArmy = (g) => ({ g, bd: Array(8).fill(null), bn: Array(4).fill(null) });
const boardCap = (round) => Math.min(8, CONFIG.boardBase + round);
const onBoard = (a) => a.bd.filter(Boolean).length;
const worth = (u) => CONFIG.units[u[0]].cost * 3 ** (u[1] - 1); // what a unit sells for
const ranged = (k) => CONFIG.units[k].range > 1.5;
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
/** Five random cards; pricier units show up more in later rounds. */
function rollShop(round) {
  const w = round <= 1 ? [75, 25, 0] : round === 2 ? [60, 32, 8] : round < 5 ? [45, 38, 17] : [35, 40, 25];
  return Array.from({ length: CONFIG.shopSize }, () => {
    let r = Math.random() * 100, tier = r < w[0] ? 1 : r < w[0] + w[1] ? 2 : 3;
    return pick(KEYS.filter((k) => CONFIG.units[k].cost === tier));
  });
}
/** Three of the same unit at the same stars merge into one a star higher, where the first one stood. */
function mergeAll(a) {
  let merged = null;
  for (let again = true; again;) {
    again = false;
    const spots = [];
    a.bd.forEach((u, i) => u && spots.push({ w: "bd", i, k: u[0], st: u[1] }));
    a.bn.forEach((u, i) => u && spots.push({ w: "bn", i, k: u[0], st: u[1] }));
    for (const s of spots) {
      const same = spots.filter((o) => o.k === s.k && o.st === s.st);
      if (s.st >= 3 || same.length < 3) continue;
      same.slice(0, 3).forEach((o) => { a[o.w][o.i] = null; });
      a[same[0].w][same[0].i] = [s.k, s.st + 1];
      merged = [s.k, s.st + 1]; again = true; break;
    }
  }
  return merged;
}
/** Buy one unit: onto the board if there's room (melee in front, ranged behind), else the bench. */
function buyUnit(a, k, round) {
  const C = CONFIG.units[k];
  if (a.g < C.cost) return "gold";
  const rows = ranged(k) ? [4, 5, 6, 7, 0, 1, 2, 3] : [0, 1, 2, 3, 4, 5, 6, 7];
  const cell = onBoard(a) < boardCap(round) ? rows.find((i) => !a.bd[i]) : undefined, slot = a.bn.findIndex((u) => !u);
  const copies = [...a.bd.map((u, i) => ["bd", i, u]), ...a.bn.map((u, i) => ["bn", i, u])].filter(([, , u]) => u && u[0] === k && u[1] === 1);
  let merged = null;
  if (cell !== undefined) a.bd[cell] = [k, 1];
  else if (slot >= 0) a.bn[slot] = [k, 1];
  else if (copies.length >= 2) { a[copies[1][0]][copies[1][1]] = null; a[copies[0][0]][copies[0][1]] = merged = [k, 2]; } // no room, but it completes a three
  else return "room";
  a.g -= C.cost;
  return mergeAll(a) || merged || "ok";
}
/** A board as the fight sees it: [[cell, key, stars], …], checked and trimmed to the round's limit. */
function cleanBoard(bd, round) {
  const out = [];
  (Array.isArray(bd) ? bd : []).slice(0, 8).forEach((u, cell) => { if (Array.isArray(u) && CONFIG.units[u[0]] && u[1] >= 1 && u[1] <= 3) out.push([cell, u[0], Math.floor(u[1])]); });
  return out.slice(0, boardCap(round));
}

// ── BATTLE ──────────────────────────────────────────────────────────────────────────
// The arena is 4 cells wide and 6 tall. Side 0 stands in rows 4–5 (front row 4), side 1 in rows 0–1,
// turned around. Only + - * / and sqrt, and a seeded random, so every browser gets the same fight.
const TICK = 0.05;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeBattle(boardA, boardB, seed) {
  const units = [];
  [boardA, boardB].forEach((bd, side) => {
    for (const [cell, k, st] of (bd || []).slice().sort((p, q) => p[0] - q[0])) {
      const C = CONFIG.units[k], col = cell % 4, row = Math.floor(cell / 4);
      const x = side === 0 ? col + 0.5 : 3.5 - col, y = side === 0 ? 4.5 + row : 1.5 - row;
      units.push({ id: units.length, k, st, side, x, y, px: x, py: y, hp: C.hp * STARS[st], max: C.hp * STARS[st], atk: C.atk * STARS[st], cd: 0.4 + (units.length % 4) * 0.12, tgt: -1, hitAt: -9, hurtAt: -9 });
    }
  });
  return { units, t: 0, rnd: mulberry32(seed), done: false, winner: -1, events: [] };
}
function nearest(B, u, side) {
  let best = -1, bd = 1e9;
  for (const o of B.units) { if (o.side !== side || o.hp <= 0 || o === u) continue; const d = (o.x - u.x) ** 2 + (o.y - u.y) ** 2; if (d < bd) { bd = d; best = o.id; } }
  return best;
}
function hurt(B, t, dmg) {
  t.hp -= dmg * (1 - (CONFIG.units[t.k].armor || 0)); t.hurtAt = B.t;
  if (t.hp <= 0) B.events.push({ k: "die", b: t.id });
}
/** One 50ms step: every unit picks the nearest enemy, walks into range, and hits (or heals). */
function stepBattle(B) {
  if (B.done) return;
  B.t += TICK;
  for (const u of B.units) { u.px = u.x; u.py = u.y; }
  for (const u of B.units) {
    if (u.hp <= 0) continue;
    const C = CONFIG.units[u.k];
    u.cd -= TICK;
    if (C.heal && u.cd <= 0) { // a healer mends the most hurt friend in range before it fights
      let best = null;
      for (const o of B.units) if (o.side === u.side && o.hp > 0 && o.hp < o.max * 0.85 && (o.x - u.x) ** 2 + (o.y - u.y) ** 2 <= C.range * C.range && (!best || o.hp / o.max < best.hp / best.max)) best = o;
      if (best) { best.hp = Math.min(best.max, best.hp + C.heal * STARS[u.st]); u.cd = 1 / C.rate; u.hitAt = B.t; B.events.push({ k: "heal", a: u.id, b: best.id }); continue; }
    }
    let t = B.units[u.tgt];
    if (!t || t.hp <= 0) { u.tgt = nearest(B, u, 1 - u.side); t = B.units[u.tgt]; }
    if (!t) continue;
    const dx = t.x - u.x, dy = t.y - u.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > C.range) { const s = Math.min(d - C.range + 0.01, C.speed * TICK); u.x += (dx / d) * s; u.y += (dy / d) * s; }
    else if (u.cd <= 0) {
      u.cd = 1 / C.rate; u.hitAt = B.t;
      const crit = B.rnd() < 0.12, dmg = u.atk * (0.9 + B.rnd() * 0.2) * (crit ? 1.6 : 1);
      B.events.push({ k: ranged(u.k) ? "shot" : "hit", a: u.id, b: t.id, crit, splash: !!C.splash, n: Math.round(dmg * (1 - (CONFIG.units[t.k].armor || 0))) });
      hurt(B, t, dmg);
      if (C.splash) for (const o of B.units) if (o !== t && o.side === t.side && o.hp > 0 && (o.x - t.x) ** 2 + (o.y - t.y) ** 2 < C.splash * C.splash) hurt(B, o, dmg * 0.5);
    }
  }
  for (const a of B.units) for (const b of B.units) { // units push each other apart
    if (a.id >= b.id || a.hp <= 0 || b.hp <= 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d >= 0.72) continue;
    const push = (0.72 - d) / 2, nx = d > 1e-6 ? dx / d : 1, ny = d > 1e-6 ? dy / d : 0;
    a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
  }
  for (const u of B.units) { u.x = Math.max(0.3, Math.min(3.7, u.x)); u.y = Math.max(0.3, Math.min(5.7, u.y)); }
  const alive = [0, 1].map((s) => B.units.some((u) => u.side === s && u.hp > 0));
  if (!alive[0] || !alive[1]) { B.done = true; B.winner = alive[0] ? 0 : alive[1] ? 1 : -1; }
  else if (B.t >= CONFIG.fightCapMs / 1000) { B.done = true; B.winner = -1; }
}
/** Run a fight to the end: who won, how hard (stars left standing), how long it took. */
function outcome(boardA, boardB, seed) {
  const B = makeBattle(boardA, boardB, seed);
  while (!B.done) { stepBattle(B); B.events.length = 0; }
  const stars = B.units.filter((u) => u.hp > 0 && u.side === B.winner).reduce((n, u) => n + u.st, 0);
  return { winner: B.winner, stars, secs: B.t };
}
const damageFor = (round, stars) => round + stars; // a lost fight costs the round number + the winners' stars left standing
const pairSeed = (g, i) => (g.seed + i * 7919) | 0;

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, bots: {}, ready: new Set(), again: new Set(), outcomes: null, wasHost: false, armies: new Map() };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  const g = shared("game", null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
function writeBots(id) { net.setShared("bots", JSON.stringify({ g: id, b: host.bots })); }
const colorOf = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || COLORS[0]);
const nameOf = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Player");
/** A new game: the live players first, bots up to CONFIG.seats, everyone at full health. */

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0, seenGame = -1;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
if (!myName) { myName = pick(NAME_A) + " " + pick(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) Object.assign(CONFIG, { seats: 6, startGold: 34, boardBase: 6, shopMs: 400, fightDelayMs: 300, afterFightMs: 1200, resultsMs: 2000 });
/** Two players picked the same color at once (the room can look empty as you join): the later sessionId picks again. */
function fixColor() {
  const g = game(), others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = g ? g.seats.filter((s) => s.b).map((s) => s.c) : [];
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !used.has(c));
  if (free && free !== myColor) { myColor = free; net.me.set("c", myColor); }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); for (const id of Object.keys(S.entities.players || {})) armyOf(id); }
  if (isHost()) hostTick(); else { host.wasHost = false; host.last = null; }
  const g = game();
  layout();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#171a2b"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (g) {
    if (seenGame !== g.id) { seenGame = g.id; fight = null; pressed = false; hintOff = false; }
    syncMine(g);
    const seat = mySeat(g);
    if (g.phase === "shop" && seat >= 0) { fight = null; drawArena(g, now); drawMyBoard(g, now); }
    else { drawArena(g, now); drawFight(g, dt, now); }
    if (!ATTRACT) drawPanel(g, now);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("ready", (d, from) => { const g = game(); if (isHost() && g && d && d.g === g.id && d.r === g.round) host.ready.add(from); });
  net.on("again", (d, from) => { const g = game(); if (isHost() && g && d && d.g === g.id) host.again.add(from); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
